<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style>
      /* Paint the correct surface before the bundled stylesheet arrives.
         Without this the empty document flashes white for a frame. */
      html {
        background: #f6f7f9;
        color-scheme: light;
      }
      html[data-theme='dark'] {
        background: #0e1014;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) {
          background: #0e1014;
          color-scheme: dark;
        }
      }
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: inherit;
      }
    </style>
    <!-- Blocking, same-origin script also works with the desktop CSP. -->
    <script src="/theme-init.js"></script>
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Lightweight local-first RSS/Atom reader" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1014" />
    <title>RSS Reader</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
