<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Lightweight local-first RSS/Atom reader" />
    <title>RSS Reader</title>
    <script>
      // Applied before first paint to avoid a light/dark flash.
      try {
        var pref = JSON.parse(localStorage.getItem('rss-reader:prefs') || '{}');
        var theme = pref.theme || 'system';
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (pref.density) document.documentElement.dataset.density = pref.density;
        if (pref.fontSize) document.documentElement.dataset.fontSize = pref.fontSize;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
