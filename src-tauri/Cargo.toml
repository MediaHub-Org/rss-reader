[package]
name = "rss-reader"
version = "0.1.0"
description = "Lightweight local-first RSS/Atom reader"
authors = ["MediaHub"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "native-tls",
  "gzip",
  "brotli",
  "deflate",
] }
url = "2"
rfd = "0.15"
open = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
