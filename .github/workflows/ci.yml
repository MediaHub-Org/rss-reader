name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (types, unit, e2e, PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/vite-dev.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite-dev.log
          exit 1

      - name: End-to-end tests
        env:
          BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: PWA installability + offline
        env:
          BASE_URL: http://127.0.0.1:4173
        run: npm run test:pwa

  desktop:
    name: Desktop (Rust checks + installer)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Rust fmt, clippy and unit tests
        run: npm run check:desktop

      - name: Build Windows installer
        if: github.event_name != 'pull_request'
        run: npm run desktop:build

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: rss-reader-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  desktop-linux:
    name: Desktop (Linux AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libxdo-dev

      - run: npm ci

      - name: Rust fmt, clippy and unit tests
        run: npm run check:desktop

      - name: Build AppImage
        if: github.event_name != 'pull_request'
        run: npm run desktop:build -- --bundles appimage

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: rss-reader-linux-${{ github.sha }}
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  desktop-macos:
    name: Desktop (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Rust fmt, clippy and unit tests
        run: npm run check:desktop

      - name: Build macOS arm64 disk image
        if: github.event_name != 'pull_request'
        run: npm run desktop:build -- --target aarch64-apple-darwin --bundles dmg

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: rss-reader-macos-arm64-${{ github.sha }}
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  desktop-android:
    name: Desktop (Android APK)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build Android APK
        if: github.event_name != 'pull_request'
        env:
          CI: true
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_HOME="$NDK_HOME"
          npm run tauri -- android build --apk -t aarch64 --ci
          VERSION=$(node -p "require('./package.json').version")
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "RSS.Reader_${VERSION}_android.apk"

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: rss-reader-android-${{ github.sha }}
          path: RSS.Reader_*_android.apk
          if-no-files-found: error
          retention-days: 14


  draft-release:
    name: Draft release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [web, desktop, desktop-linux, desktop-macos, desktop-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rss-reader-*
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "RSS Reader ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --draft
